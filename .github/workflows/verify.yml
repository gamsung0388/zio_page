name: Verify ZIO HOME
on:
  push:
    branches: [main, codex/phase1]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.1"
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install chromium
      - name: Local test settings
        run: Copy-Item .dev.vars.example .dev.vars
      - name: Unit and isolated D1 API tests
        run: npm test
      - name: Isolated browser regression tests
        run: npm run test:e2e
      - name: Reference UI regression tests
        run: npm run test:ui
      - name: Production build
        run: npm run build
